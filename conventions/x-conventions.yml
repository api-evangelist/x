description: >-
  Cross-cutting runtime semantics of the X API v2 — the things an agent needs that the
  contract alone does not state. Every value here is either published by X in prose or read
  directly out of its OpenAPI; nothing is inferred.
auth:
  styles:
  - name: App-only Bearer token
    scheme: BearerToken (http/bearer)
    use: Read-only access to public data. No user context.
  - name: OAuth 2.0 Authorization Code with PKCE
    scheme: OAuth2UserToken
    use: User context with scopes. Required for all writes.
    authorization_url: https://api.x.com/2/oauth2/authorize
    token_url: https://api.x.com/2/oauth2/token
    scopes: 26
  - name: OAuth 1.0a user context
    scheme: UserToken (http/OAuth)
    use: Legacy user context, still supported.
  discovery:
    authorization_server: https://api.x.com/.well-known/oauth-authorization-server
    protected_resource: https://api.x.com/.well-known/oauth-protected-resource
  detail: authentication/x-authentication.yml, scopes/x-scopes.yml
idempotency:
  supported: partial
  key_header: null
  scope: operation-level
  operations:
  - operationId: ensureAccount
    path: POST /2/account
    quote: >-
      "Idempotent: when the user already has an account it is returned unchanged with
      `created` false."
  - operationId: createBot
    path: POST /2/bots
    quote: >-
      "Idempotent on handle: repeating the request for a handle that already names one of the
      project's bots returns that bot with a freshly minted token, revoking the previous one —
      safe to retry when a response was lost."
  note: >-
    X publishes explicit idempotent-retry semantics on two operations, in the contract itself.
    There is NO client-supplied Idempotency-Key header anywhere in the API, so an agent cannot
    make an arbitrary write (create a Post, send a DM, add a bookmark) safely retryable. Retry
    of a lost POST /2/tweets response risks a duplicate Post AND a duplicate charge — writes
    are billed per request.
  source: openapi/_original/x-api-v2-openapi.json
