reversibility:
  grade: documented
  credit: 0.4
  basis: >-
    Nearly every write X exposes has a first-class inverse operation published in the same
    contract, and the inverses are named and easy to find. What is missing is a WINDOW: X
    does not state a time limit inside which any of these reversals is valid, so the grade
    stops at `documented` rather than `verified`. No window is asserted here, because
    asserting one X has not published would be a guess about somebody's data.
  reversible:
  - action: Create a Post
    operationId: createPosts
    reversal: deletePosts
    reversal_path: DELETE /2/tweets/{id}
    window: null
    window_source: null
    note: >-
      Deletion is available with no documented deadline, but it does not refund the write
      charge and does not un-deliver the post.create webhook event.
  - action: Like a Post
