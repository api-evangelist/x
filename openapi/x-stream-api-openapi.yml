  /2/tweets/search/stream/rules:
    get:
      security:
      - BearerToken: []
      tags:
      - Stream
      summary: Get filtered-stream rules
      description: Returns the active filtered-stream rules for the authenticated app. Provide `ids` to
        fetch specific rules; omit it to list all rules.
      externalDocs:
        url: https://docs.x.com/x-api/posts/rules-lookup
      operationId: getRules
      parameters:
      - name: ids
        in: query
        required: false
        schema:
          type: array
          maxItems: 1000
          items:
            type: string
            pattern: ^[0-9]{1,19}$
        explode: false
        style: form
      - name: max_results
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          format: int32
          default: 1000
        style: form
      - name: pagination_token
        in: query
        description: A base32hex-encoded pagination token.
        required: false
        schema:
          type: string
          minLength: 16
          maxLength: 16
        style: form
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetRulesResponse'
        default:
          description: The request has failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      security:
      - BearerToken: []
      tags:
      - Stream
      summary: Update stream rules
      description: Adds or deletes rules from the active rule set for the filtered stream. Exactly one
        of `add`, `delete`, or `?delete_all=true` must be specified. Use `?dry_run=true` to validate without
        committing.
      externalDocs:
        url: https://docs.x.com/x-api/posts/filtered-stream/integrate/add-or-delete-rules
      operationId: updateRules
      parameters:
      - name: dry_run
        in: query
        required: false
        schema:
          type: boolean
        style: form
      - name: delete_all
        in: query
        required: false
        schema:
          type: boolean
        style: form
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRulesRequest'
        required: true
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateRulesResponse'
        default:
