openapi: 3.1.0
info:
  title: X API v2 General API
  version: '2.168'
  description: The General surface of the X API v2, split by tag from the X-published OpenAPI at https://api.x.com/2/openapi.json.
  termsOfService: https://developer.x.com/en/developer-terms/agreement-and-policy.html
  contact:
    name: X Developers
    url: https://developer.x.com/
  license:
    name: X Developer Agreement and Policy
    url: https://developer.x.com/en/developer-terms/agreement-and-policy.html
servers:
- description: X API
  url: https://api.x.com
tags:
- name: General
  description: Miscellaneous endpoints for general API functionality
  externalDocs:
    description: Find out more
    url: https://docs.x.com/x-api/introduction
paths:
  /2/openapi.json:
    get:
      tags:
      - General
      summary: Get OpenAPI Spec.
      description: Retrieves the full OpenAPI Specification in JSON format. (See https://github.com/OAI/OpenAPI-Specification/blob/master/README.md)
      operationId: getOpenApiSpec
      parameters: []
      responses:
        '200':
          description: The request was successful
          content:
            application/json:
              schema:
                type: object
