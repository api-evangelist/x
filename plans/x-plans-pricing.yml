      - name: Up to 20% back in xAI API credits
  - id: x-enterprise
    name: Enterprise
    type: enterprise
    price: custom
    description: >-
      Negotiated agreement for volume above the 3M Post reads/month pay-per-usage cap, and for
      the Enterprise API surface (Account Activity, X Activity, GNIP/PowerTrack, Compliance).
      Pricing is not published.
    contact: https://docs.x.com/forms/enterprise-api-interest
    elements:
      - name: Volume above the pay-per-usage cap
      - name: Enterprise API surface
      - name: Dedicated support
      - name: Contractual limits
notes:
  - >-
    X states prices are subject to change and that the Developer Console and
    https://developer.x.com/#pricing carry the current rates. Values above were read on
    2026-08-28 and are consistent with the 2026-04-16 changelog pricing update.
  - >-
    Free access: X does not publish a free tier for the X API v2. The Usage API for enterprise
    consumption reporting is documented as free.
