    webhook_events:
      description: >-
        X Activity API webhook events are billed per event delivered, deduplicated in the same
        24-hour UTC window.
      priced:
        - event: post.create
          price: '0.005'
        - event: follow.follow
          price: '0.010'
        - event: follow.unfollow
          price: '0.010'
        - event: mute.mute
          price: '0.001'
        - event: mute.unmute
          price: '0.001'
        - event: block.block
          price: '0.001'
        - event: block.unblock
          price: '0.001'
        - event: profile.update.*
          price: '0.005'
        - event: chat.received
          price: '0.010'
        - event: dm.received
          price: '0.010'
        - event: news.new
          price: '0.005'
        - event: spaces.start
          price: '0.005'
        - event: spaces.end
          price: '0.005'
      not_billed:
        - post.delete
        - chat.sent
        - chat.conversation_join
        - dm.sent
        - dm.read
        - dm.indicate_typing
    elements:
