description: >-
  X API pricing, transcribed from X's own pricing documentation on 2026-08-28. This file
  REPLACES a 2026-05-04 scaffold that invented a Free / Professional / Enterprise tier
  ladder with placeholder quotas. X does NOT sell subscription tiers for the X API: it sells
  prepaid credits consumed per resource read and per write request. The only named plan
  boundary is self-serve pay-per-usage versus a negotiated Enterprise agreement.
model:
  type: pay-per-usage
  billing: prepaid credits, deducted in real time
  subscriptions: false
  commitments: false
  currency: USD
  deduplication:
    window: 24-hour UTC day
    description: >-
      A billable resource requested more than once inside the same UTC day is charged once.
      X calls this a soft guarantee — outages may cause a resource not to be deduplicated.
  auto_recharge: true
  negative_balance: >-
    A balance can go slightly negative, after which requests are blocked until credits cover it.
  incentive: >-
    Up to 20% back in free xAI API credits based on X API credit spend.
plan_count: 2
plans:
  - id: x-pay-per-usage
    name: Pay-per-usage
    type: usage-based
    price: '0.00'
    description: >-
      Self-serve. Buy credits in the Developer Console and pay per resource read or per write
      request. No contract, subscription, or minimum spend.
    signup: https://console.x.com
    limits:
      - name: Post reads
        limit: 3000000
        timeFrame: monthly billing cycle
        description: Pay-per-usage plans are capped at 3 million Post reads per monthly billing cycle.
    entries:
      - label: 'Posts: Read'
        name: posts_read
        type: metered
        metric: resource
        unit: 1
        price: '0.005'
