description: >-
  Client-side embeddable surfaces X publishes, distinct from the SDKs in packages/.
  X's embeddable layer is the long-standing publish/widgets platform rather than a modern
  component library — there is no first-party web-component set, element library, or embedded
  dashboard for the X API.
families:
