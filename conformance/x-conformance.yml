domain_standard:
  applicable: false
  note: >-
    Social/conversation APIs have no adopted interoperability standard for their own market —
    there is no OpenRTB, FHIR, FDX or SCIM equivalent for public social conversation data, and
    X does not implement ActivityPub (its federation-adjacent surfaces are proprietary).
    Recorded as not applicable rather than as a failure. The nearest cross-cutting standards
    X does implement — OAuth 2.0/PKCE, RFC 8414, RFC 9728 and RFC 9457 — are listed above.
