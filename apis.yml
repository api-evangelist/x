aid: x
name: X
description: X (formerly Twitter) operates the X Developer Platform, the programmable interface to the public conversation
  on X. The X API v2 is a 190-operation REST surface covering Posts, Users, Direct Messages, the encrypted Chat
  API, Lists, Spaces, Media, Communities, Community Notes, Broadcasts, News, Trends, Articles and Bots, plus a substantial
  real-time layer — filtered stream, firehose and sample volume streams, compliance streams, Account Activity webhooks
  and the X Activity API. X publishes a machine-readable OpenAPI at api.x.com/2/openapi.json, an llms.txt family,
  an AGENTS.md, an agentskills.io skill, an A2A agent card and two hosted MCP servers. Access is sold pay-per-usage
  in prepaid credits rather than by subscription tier, with an Enterprise agreement for volume above the published
  cap.
type: Index
