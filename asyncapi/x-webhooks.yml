docs: https://docs.x.com/x-api/webhooks/introduction
description: >-
  X's event and real-time surface. X publishes NO AsyncAPI document (https://docs.x.com/asyncapi.yaml
  returns 404), so this is a webhook + streaming catalog assembled from X's own event tables
  and the webhook management operations in its OpenAPI. Nothing here is fabricated; event
  names come from the X Activity API documentation and the billing table.
asyncapi_document: null
asyncapi_probe:
  url: https://docs.x.com/asyncapi.yaml
  status: 404
delivery_mechanisms:
- name: Webhooks
  description: HTTP callbacks registered against a webhook URL, with CRC validation and replay.
  docs: https://docs.x.com/x-api/webhooks/introduction
- name: Persistent HTTP stream
  description: X Activity API events delivered over a long-lived HTTP connection.
  operation: activityStream
- name: Filtered stream
  description: Rule-driven real-time Post stream with up to 1000 rules and 250 posts/sec delivery.
  operations: [streamPosts, getRules, updateRules, getRuleCounts]
- name: Volume streams
  description: Sampled and firehose streams for Posts and Likes.
  operations: [streamPostsSample, streamPostsSample10, streamPostsFirehose, streamLikesFirehose, streamLikesSample10]
- name: Compliance streams
  description: Deletion, edit and withheld-content compliance events.
  operations: [streamPostsCompliance, streamUsersCompliance, streamLikesCompliance, streamLabelsCompliance]
