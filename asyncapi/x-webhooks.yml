notes:
- >-
  Event NAMING changed on 2026-03-18 (changelog 2026-03-13); consumers pinned to the older
  format needed to migrate.
- >-
  Webhook events are billed per event delivered, deduplicated in the same 24-hour UTC window
  as resource reads. An over-broad subscription is a cost decision, not just a noise decision.
