- date: '2026-06-03'
  product: X API v2
  title: paid_partnership Post field
  breaking: false
  summary: >-
    POST /2/tweets accepts "paid_partnership": true; reads request it via
    tweet.fields=paid_partnership.
- date: '2026-05-04'
  product: X API v2
  title: Search endpoints migrating to a new search index
  breaking: true
  summary: >-
    /2/tweets/search/recent, /2/tweets/search/all, /2/tweets/counts/recent and
    /2/tweets/counts/all moved to the new X core platform search index. New operators
    min_likes:, min_replies:, min_reposts:. Reposts are no longer returned in keyword
    search results; the filtered stream is unchanged.
- date: '2026-04-16'
  product: X API
  title: 'Pricing update: Owned Reads now $0.001'
  breaking: true
  effective: '2026-04-20'
  summary: >-
    Owned Reads priced at $0.001 per resource for a named list of self-owned endpoints.
    POST /2/tweets moved to $0.015 per Post, $0.20 for Posts containing a URL, summoned
    replies $0.01. Following, Likes and Quote-Posts removed from all self-serve tiers.
- date: '2026-03-20'
  product: X API v2
  title: Deprecation of the Account Activity replay endpoint
  breaking: true
  effective: '2026-03-25'
  summary: >-
    POST /2/account_activity/replay/webhooks/{webhook_id}/subscriptions/all retired in
    favour of the consolidated POST /2/webhooks/replay.
- date: '2026-03-18'
  product: X API v2
  title: Direction filter for X Activity API subscriptions
  breaking: false
  summary: Optional `direction` filter scopes DM and chat events to sent, received, or both.
