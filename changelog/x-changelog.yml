- date: '2026-08-13'
  product: X Ads API
  title: Updated video_total_views definition
  breaking: true
  summary: >-
    video_total_views now reports views 100% in-view for at least 3 seconds plus manual
    play-button clicks. The prior MRC-standard definition (50% in-view for 2 seconds) no
    longer applies; the old behaviour survives as video_3s100pct_views.
- date: '2026-07-21'
  product: X API v2
  title: Mute and block events for X Activity API
  breaking: false
  additions: [mute.mute, mute.unmute, block.block, block.unblock]
  summary: >-
    Private events requiring user-context OAuth 2.0 with mute.read or block.read; the
    user_id filter matches the user performing the action.
